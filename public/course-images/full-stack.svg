<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Full Stack Development course image</title>
  <desc id="desc">A Full Stack Development course illustration showing frontend, backend, and database layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect x="88" y="88" width="784" height="424" rx="28" fill="#ffffff" stroke="#bae6fd" stroke-width="4"/>
  <text x="150" y="174" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900">Full Stack</text>
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">
    <rect x="150" y="240" width="220" height="74" rx="16" fill="#dbeafe"/>
    <text x="190" y="286" fill="#1d4ed8">Frontend</text>
    <rect x="370" y="342" width="220" height="74" rx="16" fill="#dcfce7"/>
    <text x="420" y="388" fill="#15803d">Backend</text>
    <rect x="590" y="240" width="220" height="74" rx="16" fill="#fef3c7"/>
    <text x="640" y="286" fill="#92400e">Database</text>
  </g>
  <path d="M370 276c68 0 92 102 0 102M590 378c-68 0-92-102 0-102" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
  <rect x="150" y="430" width="314" height="44" rx="12" fill="#ecfeff"/>
  <text x="180" y="459" fill="#0e7490" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">&lt;/&gt; Projects + Interviews</text>
</svg>
